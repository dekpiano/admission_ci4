services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admission2025_app
    ports:
      - "8083:443" # HTTPS port for admission2025
    volumes:
      - .:/var/www/html:delegated
      - /var/www/html/vendor
      - /var/www/html/writable
      - D:/xampp/librarie_skj:/home/skjacth/domains/skj.ac.th/public_html/librarie_skj:delegated
    environment:
      # Database connection settings for CodeIgniter
      DB_HOST: skj2025_db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      # Database names
      DB_DATABASE: skjacth_admission
      DB_DATABASE_SKJ: skjacth_skj
      DB_DATABASE_PERSONNEL: skjacth_personnel
    networks:
      - skj2025_default
    restart: unless-stopped

networks:
  skj2025_default:
    external: true
